
name: Build Sonora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Localizar proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            DIR="."
          else
            FILE=$(find . -type f \
              \( -path '*/app/build.gradle' \
              -o -path '*/app/build.gradle.kts' \) \
              -not -path '*/.gradle/*' | head -n 1)

            if [ -z "$FILE" ]; then
              echo "ERROR: No se encontro app/build.gradle"
              echo "Comprueba la estructura del proyecto."
              exit 1
            fi

            DIR=$(dirname "$(dirname "$FILE")")
          fi

          if [ ! -f "$DIR/settings.gradle" ] && \
             [ ! -f "$DIR/settings.gradle.kts" ]; then
            echo "ERROR: No se encontro settings.gradle"
            exit 1
          fi

          echo "SONORA_PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado: $DIR"

      - name: Compilar APK de depuracion
        shell: bash
        run: |
          set -euo pipefail
          cd "$SONORA_PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Comprobar que se genero la APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$SONORA_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontro la APK esperada"
            find "$SONORA_PROJECT_DIR/app/build/outputs" \
              -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-debug-apk
          path: ${{ env.SONORA_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
