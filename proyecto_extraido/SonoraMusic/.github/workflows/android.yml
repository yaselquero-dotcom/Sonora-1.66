name: Build Sonora APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Upload debug APK (testing only)
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: ${{ vars.SONORA_RELEASE_SIGNING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore signing keystore
        env:
          SONORA_KEYSTORE_BASE64: ${{ secrets.SONORA_KEYSTORE_BASE64 }}
        run: |
          test -n "$SONORA_KEYSTORE_BASE64" || (echo "Missing SONORA_KEYSTORE_BASE64 secret" && exit 1)
          echo "$SONORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sonora-release.jks"
      - name: Compile signed release APK
        env:
          SONORA_KEYSTORE_PATH: ${{ runner.temp }}/sonora-release.jks
          SONORA_KEYSTORE_PASSWORD: ${{ secrets.SONORA_KEYSTORE_PASSWORD }}
          SONORA_KEY_ALIAS: ${{ secrets.SONORA_KEY_ALIAS }}
          SONORA_KEY_PASSWORD: ${{ secrets.SONORA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
