
name: Build Sonora Music

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Encontrar proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "app/build.gradle" ]; then
            DIR="."
          elif [ -f "SonoraMusic/app/build.gradle" ]; then
            DIR="SonoraMusic"
          else
            FILE=$(find . -type f \
              -path '*/app/build.gradle' \
              -not -path '*/.gradle/*' | head -n 1)

            if [ -z "$FILE" ]; then
              echo "ERROR: No se encontro app/build.gradle"
              exit 1
            fi

            DIR=$(dirname "$(dirname "$FILE")")
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado: $DIR"

      - name: Compilar APK de prueba
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
